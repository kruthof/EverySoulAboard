<!--
  IMPORTED DESIGN MOCKUP — Perilune Room Zoom (Level 2), the detailed build/decorate view.
  Source: claude.ai/design project cb4b6b0f-… ("Perilune Room Zoom.dc.html"), imported via
  the claude_design MCP. READ AS A SPEC, NOT A LIVE PAGE (Design-Component runtime:
  sc-for/{{bindings}}/DCLogic; pulls a vorsatz design-system bundle + support.js not vendored).

  WHAT IT DEFINES (the Level-2 "Room Zoom" target — reached by clicking a room in Overview):
  - A big single-room BUILD CANVAS (1488x672 floor) on a warm wood-plank floor with an inset
    navy-steel border + amber top trim-light + inner shadow; a faint 32px build grid; a soft
    ambient warmth glow-pool.
  - Furniture placed at pixel positions: rug (with dashed inset), lower + upper bunks (cream
    pillows, striped/blue blankets), footlocker, desk + cyan-lit terminal + chair, wardrobe/
    locker, book shelf, framed photo, desk-lamp glow, potted plant, and a right-wall PORTHOLE
    to stars. An occupant pawn (front-facing 16x24 SVG, "Ashby").
  - Placement ghosts on a 32px grid; click floor to place, click a ghost with DEMOLISH to remove.
  - BREADCRUMB (blur-glass): ‹ PERILUNE ▸ DECK 2 ▸ CREW QUARTERS.
  - DECK MINIMAP (blur-glass, top-right): an SVG of the deck's 8-room grid, current room
    highlighted amber + a pulsing you-are-here dot.
  - CONSTRUCTION MENU (bottom-center): BUILD ▸ QUARTERS, palette WALL/DOOR/BUNK/DESK/CHAIR/
    LOCKER/SHELF/LAMP/RUG/PLANT/⌫ DEMOLISH; hint "SELECT ITEM · CLICK FLOOR TO PLACE · CLICK A
    GHOST WITH DEMOLISH TO REMOVE".

  IMPLEMENTATION NOTE (approved plan): realized as a PURE SVG/DOM view
  (client/src/ui/roomzoom-view.js + room-model.js) driven by the live wire — the `frame` cells
  clamped to the focused room's tile-rect (from the new view-only `decks` channel), rendered as
  the warm SVG item set; occupant pawns from frame.crew; build ghosts from `designs`. Functional
  furniture placement lowers to isolated sim commands (PlaceDeviceCommand); cosmetic decor
  (rug/shelf/photo/porthole) is a view-only, NON-hashed decor layer. No raster; WebGL renderer parked.
-->

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

    a{color:#e8934a}a:hover{color:#f2b563}

    @keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  </style>
</helmet>

    <div style="position:absolute;left:1360px;top:560px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#5f8a3a,#3f6b2a);box-shadow:0 0 18px 4px rgba(95,138,58,.35);pointer-events:none;"></div>
    <div style="position:absolute;left:1374px;top:600px;width:28px;height:24px;border-radius:0 0 8px 8px;background:#8a5a38;pointer-events:none;"></div>

    <!-- porthole (right wall) showing stars -->

    <div style="position:absolute;left:1466px;top:452px;width:2px;height:2px;border-radius:50%;background:#fff;pointer-events:none;"></div>

    <div style="position:absolute;left:1476px;top:486px;width:1px;height:1px;border-radius:50%;background:#cfe0ff;pointer-events:none;"></div>

    <!-- occupant pawn (Ashby) -->
    <div style="position:absolute;left:930px;top:300px;">
      <svg class="pawn" width="74" height="111" viewBox="0 0 16 24">
        <ellipse cx="8" cy="23" rx="6" ry="1.3" fill="rgba(0,0,0,.4)"></ellipse>
        <rect x="4" y="2" width="8" height="3.4" rx="1.6" fill="#3a2a1a"></rect>

        <rect x="4" y="4" width="1" height="6" fill="#3a2a1a"></rect><rect x="11" y="4" width="1" height="6" fill="#3a2a1a"></rect>
        <rect x="6" y="7" width="1" height="1" fill="#2a201a"></rect><rect x="9" y="7" width="1" height="1" fill="#2a201a"></rect>

        <rect x="2" y="11.2" width="2.4" height="5" rx="1.1" fill="#8c8377"></rect><rect x="11.6" y="11.2" width="2.4" height="5" rx="1.1" fill="#8c8377"></rect>
        <rect x="5" y="17" width="2.9" height="5" rx="1" fill="#2b2018"></rect><rect x="8.1" y="17" width="2.9" height="5" rx="1" fill="#2b2018"></rect>
        <rect x="4" y="4" width="1" height="13" fill="rgba(242,181,99,.4)"></rect>

    </div>

    <!-- placement ghosts -->
    <sc-for list="{{ghostsD}}" as="g" hint-placeholder-count="0">
      <div onClick="{{g.on}}" style="position:absolute;left:{{g.x}}px;top:{{g.y}}px;width:32px;height:32px;box-sizing:border-box;border:1.5px dashed #f2b563;background:rgba(232,147,74,.22);color:#f2b563;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;">{{g.label}}</div>

        <rect x="114" y="37" width="26" height="13" rx="2" fill="#e8863c" stroke="#f2b563" stroke-width="1.5"></rect>

    <div style="font-size:9.5px;color:#57503f;letter-spacing:.06em;">SELECT AN ITEM · CLICK THE FLOOR TO PLACE · CLICK A GHOST WITH DEMOLISH TO REMOVE</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1600, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { toolD: 'bunk', placedD: [] };
  renderVals() {
    const tools = [ ['wall','WALL'], ['door','DOOR'], ['bunk','BUNK'], ['desk','DESK'], ['chair','CHAIR'], ['locker','LOCKER'], ['shelf','SHELF'], ['lamp','LAMP'], ['rug','RUG'], ['plant','PLANT'], ['demo','⌫ DEMOLISH'] ];
    const abbr = { wall:'WA', door:'DO', bunk:'BU', desk:'DE', chair:'CH', locker:'LO', shelf:'SH', lamp:'LA', rug:'RU', plant:'PL' };
    return {
      buildItemsD: tools.map(([k, label]) => ({ label, on: () => this.setState({ toolD: k }), bg: k === this.state.toolD ? (k === 'demo' ? '#3a1a10' : '#3a2a12') : 'rgba(26,22,17,.5)', fg: k === this.state.toolD ? (k === 'demo' ? '#e07a5f' : '#f2b563') : '#8c8377', bd: k === this.state.toolD ? (k === 'demo' ? '#a53a25' : '#cf7a33') : '#3a332a' })),
      placedCountD: this.state.placedD.length + ' PLACED',
      ghostsD: this.state.placedD.map((pl, i) => ({ x: pl.x, y: pl.y, label: abbr[pl.t] || '?', on: (e) => { e.stopPropagation(); if (this.state.toolD === 'demo') this.setState(s => ({ placedD: s.placedD.filter((_, j) => j !== i) })); } })),
      placeD: (e) => {
        const t = this.state.toolD;
        if (!t || t === 'demo') return;
        const rect = e.currentTarget.getBoundingClientRect();
        const g = 32;
        const x = Math.max(6, Math.min(1450, Math.floor((e.clientX - rect.left) * (1488 / rect.width) / g) * g));
        const y = Math.max(6, Math.min(634, Math.floor((e.clientY - rect.top) * (672 / rect.height) / g) * g));
        this.setState(s => ({ placedD: [...s.placedD, { x, y, t }] }));
      },
    };
  }
}
</script>
</body>
</html>
